spring.application.name=apigateway
server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.discovery.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DEMO20_SPRINGREST
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER_MANAGEMENT_SYSTEM
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**